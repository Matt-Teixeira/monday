# no "version" key

x-common-env: &common_env
  env_file:
    - .env

  extra_hosts:
    - "host.docker.internal:host-gateway"

  environment:
    HOME: /tmp
    NPM_CONFIG_CACHE: /tmp/.npm

x-common-mounts: &common_mounts
  working_dir: /workspace
  volumes:
    # Project source → live edit on host reflects in container. node_modules is
    # IN-TREE (installed by build.sh as the host user), so it rides along in
    # this mount — the shared /opt/resources/node_mod_cache mount is retired,
    # each copy (dev clone, release) owns its own deps.
    - ./:/workspace

    # PostgreSQL server certificate (read-only). PG_SSLMODE=verify-full
    # reads it at PG_SSL_PATH; the pool fails closed if it is missing.
    - /opt/resources/ssl:/opt/resources/ssl:ro

# ---------- Services ----------
services:
  app:
    # USER_ID drives the tag: monday:<username> for dev builds, monday:svc for
    # the release copy (flipped by #RELEASE:USER_ID=svc at release time).
    image: monday:${USER_ID}
    build:
      context: .
      # Host identity comes from .env so this file stays host-agnostic and the
      # dev and staging branches can share it. See .env.example.
      args:
        USER_ID: ${USER_ID}
        DOCKER_GID: ${DOCKER_GID}
        UID_0: ${UID_0}
        UID_1: ${UID_1}
        UID_2: ${UID_2}
    <<: [*common_env, *common_mounts]
    environment:
      # Intentionally unset in .env: empty -> entrypoint.sh defaults to svc,
      # so ONE place decides the production identity. Dev runs pass it on the
      # command line. ':-' silences the compose WARN.
      RUN_USER: ${RUN_USER:-}
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm
      # Local PG container overrides
      PGHOST: pg_db
      PGPORT: "5432"
      PG_SSLMODE: verify-full
      PG_SSL_PATH: /opt/resources/ssl/pg_ssl.crt
    networks:
      - pg_net

# Declare external networks
networks:
  pg_net:
    external: true
